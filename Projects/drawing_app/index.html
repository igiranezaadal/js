<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Draw</title>
</head>
<body>
  <div class="wrapper">
    <canvas
      id="canvas"
      style="width: 70vw; height: 70vh; border: 1px solid black; display: block; cursor: crosshair;"
    ></canvas>
    <button id="clear">Clear</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
